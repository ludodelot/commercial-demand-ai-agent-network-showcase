<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A 1P commerce cycle</title>
  <desc id="desc">A synthetic retail workflow shown as a continuous loop. Demand informs assortment, a joint budget is allocated across suppliers, available-to-promise stock and payment terms are checked, buyer and supplier approvals authorize a purchase order, goods arrive at a distribution center, move separately to stores, and sell-out feeds the next demand plan. Wholesale price is fixed while assortment and quantities are negotiated.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#83A6FF"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#5DE1CC"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#FFC978"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { fill:#8CA7D0; font-size:12px; font-weight:750; letter-spacing:2px; }
      .headline { fill:#F4F7FF; font-size:30px; font-weight:730; letter-spacing:-.7px; }
      .subtitle { fill:#BCC9E0; font-size:14px; }
      .card { fill:#10203D; stroke:#344A70; stroke-width:1.4; }
      .outline { fill:none; stroke:transparent; stroke-width:2.5; }
      .card-title { fill:#F4F7FF; font-size:16px; font-weight:720; }
      .body { fill:#C1CDE2; font-size:13px; font-weight:450; }
      .tag { fill:#92A8CA; font-size:10.5px; font-weight:730; letter-spacing:1px; }
      .num { fill:#09172E; font-size:11px; font-weight:850; text-anchor:middle; dominant-baseline:central; }
      .flow { fill:none; stroke-width:2.5; stroke-dasharray:5 8; stroke-linecap:round; animation:flow 1.05s linear infinite; }
      .flow-blue { stroke:#83A6FF; marker-end:url(#arrow-blue); }
      .flow-teal { stroke:#5DE1CC; marker-end:url(#arrow-teal); }
      .flow-amber { stroke:#FFC978; marker-end:url(#arrow-amber); }
      .feedback { stroke-dasharray:4 7; }
      .stage-focus { animation-duration:12s; animation-timing-function:linear; animation-iteration-count:infinite; }
      .s1 { animation-name:focus1; animation-delay:0s; }
      .s2 { animation-name:focus2; animation-delay:-10.666s; }
      .s3 { animation-name:focus3; animation-delay:-9.333s; }
      .s4 { animation-name:focus4; animation-delay:-8s; }
      .s5 { animation-name:focus5; animation-delay:-6.666s; }
      .s6 { animation-name:focus6; animation-delay:-5.333s; }
      .s7 { animation-name:focus7; animation-delay:-4s; }
      .s8 { animation-name:focus8; animation-delay:-2.666s; }
      .s9 { animation-name:focus9; animation-delay:-1.333s; }
      @keyframes flow { to { stroke-dashoffset:-26; } }
      @keyframes focus1 { 0%,8% { stroke:#A7BFFF; filter:drop-shadow(0 0 5px #698BFF); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus2 { 0%,8% { stroke:#A7BFFF; filter:drop-shadow(0 0 5px #698BFF); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus3 { 0%,8% { stroke:#A7BFFF; filter:drop-shadow(0 0 5px #698BFF); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus4 { 0%,8% { stroke:#A7BFFF; filter:drop-shadow(0 0 5px #698BFF); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus5 { 0%,8% { stroke:#FFE0A2; filter:drop-shadow(0 0 5px #E6A64C); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus6 { 0%,8% { stroke:#FFE0A2; filter:drop-shadow(0 0 5px #E6A64C); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus7 { 0%,8% { stroke:#FFE0A2; filter:drop-shadow(0 0 5px #E6A64C); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus8 { 0%,8% { stroke:#9BF3E6; filter:drop-shadow(0 0 5px #31BFAE); } 9%,100% { stroke:transparent; filter:none; } }
      @keyframes focus9 { 0%,8% { stroke:#9BF3E6; filter:drop-shadow(0 0 5px #31BFAE); } 9%,100% { stroke:transparent; filter:none; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .stage-focus { animation:none !important; }
        .flow { stroke-dasharray:none; }
        .outline { stroke:transparent; filter:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#07152F"/>
  <path d="M0 0H1200V94H0Z" fill="#0B1B38"/>
  <path d="M38 94H1162" stroke="#25395D"/>
  <text x="40" y="29" class="eyebrow">COMMERCIAL OPERATING MODEL · SYNTHETIC 1P</text>
  <text x="40" y="67" class="headline">From demand signal to shelf-ready stock</text>
  <text x="1160" y="49" text-anchor="end" class="subtitle">A connected retail cycle</text>

  <text x="40" y="119" class="eyebrow">PLAN &amp; COMMIT</text>
  <text x="1160" y="370" text-anchor="end" class="eyebrow">FULFILL &amp; LEARN · FLOW READS RIGHT TO LEFT</text>

  <!-- Flow across planning, ending at two-party approvals. -->
  <path class="flow flow-blue" d="M224 219H258"/>
  <path class="flow flow-blue" d="M456 219H490"/>
  <path class="flow flow-blue" d="M688 219H722"/>
  <path class="flow flow-blue" d="M920 219H954"/>

  <!-- Stage 1: demand -->
  <g>
    <rect class="card" x="38" y="143" width="186" height="153" rx="15"/>
    <rect class="outline stage-focus s1" x="38" y="143" width="186" height="153" rx="15"/>
    <rect x="38" y="143" width="186" height="4" rx="2" fill="#5DE1CC"/>
    <circle cx="60" cy="169" r="12" fill="#5DE1CC"/><text x="60" y="169" class="num">1</text>
    <path d="M163 176v-11m9 11v-20m9 20v-8m9 8v-14" stroke="#5DE1CC" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="208" class="card-title">Demand</text>
    <text x="54" y="234" class="body">Forecast + sell-out</text>
    <text x="54" y="254" class="body">shape the buying need.</text>
    <text x="54" y="279" class="tag">BUYER PLANNING</text>
  </g>

  <!-- Stage 2: assortment -->
  <g>
    <rect class="card" x="270" y="143" width="186" height="153" rx="15"/>
    <rect class="outline stage-focus s2" x="270" y="143" width="186" height="153" rx="15"/>
    <rect x="270" y="143" width="186" height="4" rx="2" fill="#5DE1CC"/>
    <circle cx="292" cy="169" r="12" fill="#5DE1CC"/><text x="292" y="169" class="num">2</text>
    <path d="M398 159h31v28h-31zM404 166h19M404 172h19M404 178h13" fill="none" stroke="#5DE1CC" stroke-width="1.8" stroke-linecap="round"/>
    <text x="286" y="208" class="card-title">Assortment</text>
    <text x="286" y="234" class="body">Choose the range;</text>
    <text x="286" y="254" class="body">evaluate new launches.</text>
    <text x="286" y="279" class="tag">MIX IS NEGOTIATED</text>
  </g>

  <!-- Stage 3: joint budget -->
  <g>
    <rect class="card" x="502" y="143" width="186" height="153" rx="15"/>
    <rect class="outline stage-focus s3" x="502" y="143" width="186" height="153" rx="15"/>
    <rect x="502" y="143" width="186" height="4" rx="2" fill="#83A6FF"/>
    <circle cx="524" cy="169" r="12" fill="#83A6FF"/><text x="524" y="169" class="num">3</text>
    <circle cx="648" cy="171" r="14" fill="none" stroke="#83A6FF" stroke-width="2"/><path d="M648 161v20m6-16c-1-3-10-3-10 1 0 5 10 2 10 7 0 4-9 5-11 1" fill="none" stroke="#83A6FF" stroke-width="1.6" stroke-linecap="round"/>
    <text x="518" y="208" class="card-title">Joint budget</text>
    <text x="518" y="234" class="body">Compare suppliers within</text>
    <text x="518" y="254" class="body">one shared envelope.</text>
    <text x="518" y="279" class="tag">HARD SPEND LIMIT</text>
  </g>

  <!-- Stage 4: supplier ATP and terms -->
  <g>
    <rect class="card" x="734" y="143" width="186" height="153" rx="15"/>
    <rect class="outline stage-focus s4" x="734" y="143" width="186" height="153" rx="15"/>
    <rect x="734" y="143" width="186" height="4" rx="2" fill="#83A6FF"/>
    <circle cx="756" cy="169" r="12" fill="#83A6FF"/><text x="756" y="169" class="num">4</text>
    <path d="M862 160h33v27h-33zM868 167h21M868 173h14M868 179h17" fill="none" stroke="#83A6FF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="750" y="208" class="card-title">ATP + terms</text>
    <text x="750" y="234" class="body">Check supplier stock</text>
    <text x="750" y="254" class="body">and existing payment terms.</text>
    <text x="750" y="279" class="tag">PRICE LIST IS FIXED</text>
  </g>

  <!-- Stage 5: dual approvals -->
  <g>
    <rect class="card" x="966" y="143" width="196" height="153" rx="15"/>
    <rect class="outline stage-focus s5" x="966" y="143" width="196" height="153" rx="15"/>
    <rect x="966" y="143" width="196" height="4" rx="2" fill="#FFC978"/>
    <circle cx="988" cy="169" r="12" fill="#FFC978"/><text x="988" y="169" class="num">5</text>
    <path d="M1090 159l11 4v8c0 7-5 12-11 15-6-3-11-8-11-15v-8z" fill="none" stroke="#FFC978" stroke-width="1.8"/><path d="m1085 171 4 4 8-9" fill="none" stroke="#FFC978" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="982" y="208" class="card-title">Dual approvals</text>
    <text x="982" y="234" class="body">Buyer approver + supplier</text>
    <text x="982" y="254" class="body">KAM confirm the agreement.</text>
    <text x="982" y="279" class="tag">SIMULATED &amp; RECORDED</text>
  </g>

  <!-- Approved agreement flows down into the order -->
  <path class="flow flow-amber" d="M1064 296V337Q1064 349 1052 349H1035V396"/>
  <rect x="1045" y="310" width="39" height="22" rx="11" fill="#3C3023" stroke="#73562D"/>
  <text x="1064.5" y="325" text-anchor="middle" fill="#FFDB9B" font-size="10.5" font-weight="800" letter-spacing=".8">GO</text>

  <!-- Fulfillment sequence moves right-to-left: PO, DC, POS, sell-out. -->
  <path class="flow flow-teal" d="M930 479H895"/>
  <path class="flow flow-teal" d="M660 479H625"/>
  <path class="flow flow-teal" d="M390 479H355"/>

  <!-- Stage 6: purchase order -->
  <g>
    <rect class="card" x="930" y="397" width="225" height="163" rx="15"/>
    <rect class="outline stage-focus s6" x="930" y="397" width="225" height="163" rx="15"/>
    <rect x="930" y="397" width="225" height="4" rx="2" fill="#FFC978"/>
    <circle cx="954" cy="423" r="12" fill="#FFC978"/><text x="954" y="423" class="num">6</text>
    <path d="M1090 412h34v31h-34zM1096 420h22M1096 427h22M1096 434h14" fill="none" stroke="#FFC978" stroke-width="1.7" stroke-linecap="round"/>
    <text x="948" y="465" class="card-title">Purchase order</text>
    <text x="948" y="491" class="body">Agreed quantities commit;</text>
    <text x="948" y="512" class="body">supplier stock is reserved.</text>
    <text x="948" y="541" class="tag">RELEASED TO SHIP</text>
  </g>

  <!-- Stage 7: distribution center receipt -->
  <g>
    <rect class="card" x="660" y="397" width="225" height="163" rx="15"/>
    <rect class="outline stage-focus s7" x="660" y="397" width="225" height="163" rx="15"/>
    <rect x="660" y="397" width="225" height="4" rx="2" fill="#FFC978"/>
    <circle cx="684" cy="423" r="12" fill="#FFC978"/><text x="684" y="423" class="num">7</text>
    <path d="M811 416h41v25h-41zM807 416l24-13 25 13M819 441v-13h12v13m5-13h11v13h-11" fill="none" stroke="#FFC978" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="678" y="465" class="card-title">DC receipt</text>
    <text x="678" y="490" class="body">Goods arrive at the</text>
    <text x="678" y="511" class="body">distribution center first.</text>
    <rect x="677" y="526" width="191" height="23" rx="7" fill="#3C3023"/>
    <text x="772.5" y="542" text-anchor="middle" fill="#FFDB9B" font-size="11" font-weight="760">DC receipt ≠ store replenishment</text>
  </g>

  <!-- Stage 8: separate POS transfer -->
  <g>
    <rect class="card" x="390" y="397" width="225" height="163" rx="15"/>
    <rect class="outline stage-focus s8" x="390" y="397" width="225" height="163" rx="15"/>
    <rect x="390" y="397" width="225" height="4" rx="2" fill="#5DE1CC"/>
    <circle cx="414" cy="423" r="12" fill="#5DE1CC"/><text x="414" y="423" class="num">8</text>
    <path d="M543 416h36v26h-36zM550 411h22M550 423h22M550 430h15" fill="none" stroke="#5DE1CC" stroke-width="1.7" stroke-linecap="round"/>
    <text x="408" y="465" class="card-title">POS transfer</text>
    <text x="408" y="491" class="body">A separate allocation moves</text>
    <text x="408" y="512" class="body">stock from DC to store.</text>
    <text x="408" y="541" class="tag">STORE STOCK UPDATES LATER</text>
  </g>

  <!-- Stage 9: feedback -->
  <g>
    <rect class="card" x="120" y="397" width="225" height="163" rx="15"/>
    <rect class="outline stage-focus s9" x="120" y="397" width="225" height="163" rx="15"/>
    <rect x="120" y="397" width="225" height="4" rx="2" fill="#5DE1CC"/>
    <circle cx="144" cy="423" r="12" fill="#5DE1CC"/><text x="144" y="423" class="num">9</text>
    <path d="M273 439v-23m9 23v-14m9 14v-30m9 30v-9" stroke="#5DE1CC" stroke-width="2.5" stroke-linecap="round"/>
    <text x="138" y="465" class="card-title">Sell-out feedback</text>
    <text x="138" y="491" class="body">Sales + stock signals inform</text>
    <text x="138" y="512" class="body">the next demand plan.</text>
    <text x="138" y="541" class="tag">LEARNING LOOP</text>
  </g>

  <!-- Feedback returns to the next demand cycle. -->
  <path class="flow flow-teal feedback" d="M120 478H71Q49 478 49 456V337Q49 321 65 321H108Q125 321 125 304V298"/>
  <rect x="39" y="352" width="94" height="26" rx="13" fill="#10343E" stroke="#286B70"/>
  <text x="86" y="369" text-anchor="middle" fill="#91F0E2" font-size="10.5" font-weight="800" letter-spacing=".6">FEEDBACK</text>

  <path d="M40 589H1160" stroke="#25395D"/>
  <circle cx="50" cy="615" r="4" fill="#83A6FF"/>
  <text x="63" y="620" class="subtitle">Wholesale price is fixed.</text>
  <circle cx="269" cy="615" r="4" fill="#5DE1CC"/>
  <text x="282" y="620" class="subtitle">Assortment and quantities are negotiated.</text>
  <text x="1160" y="619" text-anchor="end" class="tag">SYNTHETIC SCENARIO · NO LIVE ORDERS</text>
</svg>
