<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Amazon and Canon agreement room</title>
  <desc id="description">A synthetic scenario illustration of a commercial agreement between Amazon and Canon. Buyer internal, shared agreement, and supplier internal columns show demand, assortment, quantity, fixed price, funding, delivery, reservation, and approvals in proposed, accepted, and awaiting approval states. This is not a live dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a35"/>
      <stop offset="1" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#192955"/>
      <stop offset="1" stop-color="#15223f"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e7cff"/>
      <stop offset="1" stop-color="#8ba1ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020611" flood-opacity=".3"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.7px; }
      .title { font-size: 29px; font-weight: 650; letter-spacing: -.6px; }
      .subtitle { font-size: 13px; }
      .column-title { font-size: 15px; font-weight: 650; }
      .column-note { font-size: 11px; }
      .block-title { font-size: 13px; font-weight: 650; }
      .body { font-size: 11px; }
      .micro { font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="42" r="170" fill="#304b9b" opacity=".09"/>
  <circle cx="110" cy="610" r="190" fill="#1f9e9a" opacity=".055"/>

  <!-- Header -->
  <g id="header">
    <text x="48" y="42" class="eyebrow" fill="#7f96d9">COMMERCIAL NETWORK  /  AGREEMENT ROOM</text>
    <text x="48" y="82" class="title" fill="#f3f6ff">Amazon <tspan fill="#718cff">↔</tspan> Canon</text>
    <text x="48" y="108" class="subtitle" fill="#aeb9d6">A 1P camera assortment takes shape across three visibility lanes</text>
    <g transform="translate(867 39)">
      <rect width="285" height="38" rx="19" fill="#173d43" stroke="#2e787a"/>
      <circle cx="19" cy="19" r="4" fill="#55d6c5"/>
      <text x="32" y="23" class="micro" fill="#8de5d9">SYNTHETIC SCENARIO · NOT LIVE</text>
    </g>
    <g transform="translate(48 132)">
      <rect width="45" height="22" rx="11" fill="#23345f"/>
      <text x="22.5" y="15" text-anchor="middle" class="micro" fill="#b9c7ff">1P</text>
      <text x="57" y="15" class="body" fill="#8694b5">Retailer-owned inventory</text>
      <circle cx="248" cy="11" r="3" fill="#55d6c5"/>
      <text x="259" y="15" class="body" fill="#8694b5">Fixed list price · terms are not negotiated</text>
    </g>
  </g>

  <!-- Lane connectors behind cards -->
  <g id="handoff-paths" fill="none" stroke-linecap="round">
    <path d="M386 235 C401 235 404 235 418 235" stroke="#6f8cff" stroke-width="2" stroke-dasharray="3 6" opacity=".7"/>
    <path d="M782 235 C796 235 799 235 814 235" stroke="#55d6c5" stroke-width="2" stroke-dasharray="3 6" opacity=".7"/>
    <path d="M386 468 C401 468 404 468 418 468" stroke="#6f8cff" stroke-width="2" stroke-dasharray="3 6" opacity=".45"/>
    <path d="M782 468 C796 468 799 468 814 468" stroke="#55d6c5" stroke-width="2" stroke-dasharray="3 6" opacity=".45"/>
  </g>

  <!-- Three visibility lanes -->
  <g id="buyer-internal" filter="url(#soft-shadow)">
    <rect x="48" y="180" width="338" height="394" rx="18" fill="#121b31" stroke="#283552"/>
    <rect x="48" y="180" width="338" height="4" rx="2" fill="#6f8cff"/>
    <circle cx="72" cy="211" r="5" fill="#6f8cff"/>
    <text x="87" y="216" class="column-title" fill="#edf1ff">Buyer internal</text>
    <text x="72" y="239" class="column-note" fill="#8996b5">Amazon · private planning and funding</text>

    <g transform="translate(68 260)">
      <rect width="298" height="91" rx="12" fill="#18233b" stroke="#2b3856"/>
      <text x="16" y="25" class="block-title" fill="#edf1ff">Demand case</text>
      <text x="16" y="46" class="body" fill="#aab6d1">Forecast-backed camera need</text>
      <text x="16" y="64" class="body" fill="#aab6d1">Buyer plan · 42 units across 2 lines</text>
      <rect x="211" y="13" width="71" height="20" rx="10" fill="#173d43"/>
      <circle cx="223" cy="23" r="3" fill="#55d6c5"/>
      <text x="232" y="27" class="micro" fill="#8de5d9">READY</text>
    </g>
    <g transform="translate(68 363)">
      <rect width="298" height="91" rx="12" fill="#18233b" stroke="#2b3856"/>
      <text x="16" y="25" class="block-title" fill="#edf1ff">Funding</text>
      <text x="16" y="46" class="body" fill="#aab6d1">Buyer budget held for this agreement</text>
      <text x="16" y="64" class="body" fill="#aab6d1">Private to Amazon · amount omitted</text>
      <rect x="201" y="13" width="81" height="20" rx="10" fill="#173d43"/>
      <circle cx="213" cy="23" r="3" fill="#55d6c5"/>
      <text x="222" y="27" class="micro" fill="#8de5d9">RESERVED</text>
    </g>
    <g transform="translate(68 466)">
      <rect width="298" height="86" rx="12" fill="#18233b" stroke="#2b3856"/>
      <text x="16" y="25" class="block-title" fill="#edf1ff">Purchase approval</text>
      <text x="16" y="47" class="body" fill="#aab6d1">Human buyer review before release</text>
      <rect x="184" y="57" width="98" height="20" rx="10" fill="#4b3b25"/>
      <circle cx="196" cy="67" r="3" fill="#f4bb68"/>
      <text x="205" y="71" class="micro" fill="#ffd38f">AWAITING</text>
    </g>
  </g>

  <g id="shared-agreement" filter="url(#soft-shadow)">
    <rect x="418" y="180" width="364" height="394" rx="18" fill="url(#shared)" stroke="#4262bd" stroke-opacity=".72"/>
    <rect x="418" y="180" width="364" height="4" rx="2" fill="url(#cobalt)"/>
    <circle cx="442" cy="211" r="5" fill="#8ba1ff"/>
    <text x="457" y="216" class="column-title" fill="#f3f6ff">Shared agreement</text>
    <text x="442" y="239" class="column-note" fill="#a1b0d7">Visible to both parties · agreement v1</text>

    <g transform="translate(438 260)">
      <rect width="324" height="79" rx="12" fill="#1b2b53" stroke="#3a579f"/>
      <text x="16" y="25" class="block-title" fill="#f0f3ff">Assortment</text>
      <text x="16" y="47" class="body" fill="#b5c2e4">EOS R50 kit + RF-S lens line</text>
      <rect x="237" y="13" width="71" height="20" rx="10" fill="#173d43"/>
      <circle cx="249" cy="23" r="3" fill="#55d6c5"/>
      <text x="258" y="27" class="micro" fill="#8de5d9">ACCEPTED</text>
    </g>
    <g transform="translate(438 350)">
      <rect width="324" height="79" rx="12" fill="#1b2b53" stroke="#3a579f"/>
      <text x="16" y="25" class="block-title" fill="#f0f3ff">Quantities</text>
      <text x="16" y="47" class="body" fill="#b5c2e4">42 units · proposed by Amazon</text>
      <rect x="227" y="13" width="81" height="20" rx="10" fill="#25335b"/>
      <circle cx="239" cy="23" r="3" fill="#8ba1ff"/>
      <text x="248" y="27" class="micro" fill="#bdcaff">PROPOSED</text>
    </g>
    <g transform="translate(438 440)">
      <rect width="324" height="79" rx="12" fill="#1b2b53" stroke="#3a579f"/>
      <text x="16" y="25" class="block-title" fill="#f0f3ff">Price &amp; payment terms</text>
      <text x="16" y="47" class="body" fill="#b5c2e4">Fixed list price · 60-day terms</text>
      <rect x="237" y="13" width="71" height="20" rx="10" fill="#173d43"/>
      <circle cx="249" cy="23" r="3" fill="#55d6c5"/>
      <text x="258" y="27" class="micro" fill="#8de5d9">ACCEPTED</text>
    </g>
    <text x="442" y="549" class="body" fill="#aab8db">Delivery window: AM-SEA · estimated arrival Nov 06</text>
  </g>

  <g id="supplier-internal" filter="url(#soft-shadow)">
    <rect x="814" y="180" width="338" height="394" rx="18" fill="#121d31" stroke="#244651"/>
    <rect x="814" y="180" width="338" height="4" rx="2" fill="#55d6c5"/>
    <circle cx="838" cy="211" r="5" fill="#55d6c5"/>
    <text x="853" y="216" class="column-title" fill="#edf9f6">Supplier internal</text>
    <text x="838" y="239" class="column-note" fill="#8ca8ad">Canon · private supply and account review</text>

    <g transform="translate(834 260)">
      <rect width="298" height="91" rx="12" fill="#162733" stroke="#294b54"/>
      <text x="16" y="25" class="block-title" fill="#edf9f6">Stock allocation</text>
      <text x="16" y="46" class="body" fill="#a8bec1">Units held against available supply</text>
      <text x="16" y="64" class="body" fill="#a8bec1">Canon inventory · private detail</text>
      <rect x="201" y="13" width="81" height="20" rx="10" fill="#173d43"/>
      <circle cx="213" cy="23" r="3" fill="#55d6c5"/>
      <text x="222" y="27" class="micro" fill="#8de5d9">RESERVED</text>
    </g>
    <g transform="translate(834 363)">
      <rect width="298" height="91" rx="12" fill="#162733" stroke="#294b54"/>
      <text x="16" y="25" class="block-title" fill="#edf9f6">Terms validation</text>
      <text x="16" y="46" class="body" fill="#a8bec1">Finance confirms account terms</text>
      <text x="16" y="64" class="body" fill="#a8bec1">No price negotiation in this scenario</text>
      <rect x="211" y="13" width="71" height="20" rx="10" fill="#173d43"/>
      <circle cx="223" cy="23" r="3" fill="#55d6c5"/>
      <text x="232" y="27" class="micro" fill="#8de5d9">ACCEPTED</text>
    </g>
    <g transform="translate(834 466)">
      <rect width="298" height="86" rx="12" fill="#162733" stroke="#294b54"/>
      <text x="16" y="25" class="block-title" fill="#edf9f6">Supplier KAM approval</text>
      <text x="16" y="47" class="body" fill="#a8bec1">Canon review before PO release</text>
      <rect x="184" y="57" width="98" height="20" rx="10" fill="#4b3b25"/>
      <circle cx="196" cy="67" r="3" fill="#f4bb68"/>
      <text x="205" y="71" class="micro" fill="#ffd38f">AWAITING</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="footer">
    <path d="M48 598H1152" stroke="#26334f"/>
    <text x="48" y="624" class="body" fill="#9aa8c7">Illustrative agreement lifecycle · invented demo values · not connected to retailer or supplier systems</text>
    <text x="1152" y="624" text-anchor="end" class="micro" fill="#7180a2">PROPOSE → REVIEW → RELEASE</text>
  </g>
</svg>
